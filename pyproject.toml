[project]
name = "hkclr-rapidocr-evaluation"
version = "0.1.0"
description = "Local RapidOCR evaluation harness for HKCLR reimbursement screenshots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.0,<13",
    "rapidocr>=3.9,<4",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.20,<2",
]

[project.scripts]
hkclr-ocr = "hkclr_rapidocr_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hkclr_rapidocr_eval"]

